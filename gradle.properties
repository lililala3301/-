mod_description=Send a creature's English ID initial or Chinese name initial plus the trigger phrase, and make it cry and run away at 20 blocks per second with ground, swimming and flying movement profiles. Position writes use final methods and are re-asserted twice per tick; deletion beyond visible distance is silent. Also adds a craftable Komeiji Satori fumo with size-scaled read-mind labels, a custom no-target reply, and a creature chat response on a successful trigger.
